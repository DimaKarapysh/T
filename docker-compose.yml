version: "3.9"

services:
  auth:
    container_name: tasks
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    depends_on:
      - redis
      - postgres
      - jaeger


  redis:
    image: redis:6.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    env_file:
      - .env.docker

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    ports:
      - "${HOST_POSTGRES_PORT:-5433}:5432"
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: auth
    volumes:
      - postgres_data:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "14268:14268"   # HTTP collector (то, что ты используешь)
      - "4317:4317"     # OTLP gRPC (на будущее)
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  postgres_data:
