version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/storage/postgres/sqlc"
    gen:
      go:
        out: "internal/repo/postgres/sqlc"
        package: "sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        sql_package: "pgx/v5"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "date"
            go_type:
              import: "time"
              type: "Time"
            nullable: false
          - db_type: "date"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
            nullable: true
